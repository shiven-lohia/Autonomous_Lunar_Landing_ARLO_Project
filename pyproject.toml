[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garl-lander"
version = "1.0.0"
description = "Reproducible genetic algorithm, PPO and GA-initialized PPO LunarLander study"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "torch>=2.3,<3", "gymnasium[box2d]>=1.2,<2",
  "stable-baselines3>=2.7,<3", "pygame-ce>=2.5,<3", "pandas>=2.2,<3",
  "matplotlib>=3.9,<4", "seaborn>=0.13,<1", "scipy>=1.13,<2",
  "PyYAML>=6,<7", "tqdm>=4.66,<5", "tensorboard>=2.17,<3",
  "imageio>=2.35,<3", "imageio-ffmpeg>=0.5,<1", "reportlab>=4.2,<5",
  "pymupdf>=1.24,<2", "psutil>=6,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["garl_lander*", "scripts*"]
exclude = [".tools*", ".python*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
